<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Entertainment Metadata AI Fork</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="background-grid"></div>
<div class="cursor-glow"></div>

<div class="app-container">

  <!-- HEADER -->
  <header class="hero">
    <div class="logo-wrapper">
      <div class="logo-circle"></div>
      <h1>Entertainment Metadata AI</h1>
    </div>

    <p class="subtitle">
      Intelligent metadata exploration for movies, series, anime, documentaries,
      podcasts, events and entertainment ecosystems.
    </p>
  </header>

  <!-- SEARCH -->
  <section class="search-section">

    <div class="search-container">
      <input
        type="text"
        id="searchInput"
        placeholder="Search movies, series, podcasts, events..."
      />

      <button id="searchBtn">
        <span>Search</span>
      </button>
    </div>

  </section>

  <!-- LOADER -->
  <div id="loader" class="loader hidden">
    <div class="scanner-line"></div>
    <div class="loader-circle"></div>
    <p>Scanning metadata...</p>
  </div>

  <!-- ERROR -->
  <div id="errorMessage" class="error-message hidden"></div>

  <!-- RESULTS -->
  <section id="resultsGrid" class="results-grid"></section>

</div>
<!-- IMAGE MODAL -->

<div id="imageModal" class="modal" onclick="closeModal(event)">

  <span class="close">&times;</span>

  <img id="modalImg" class="modal-img">

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
